
<div id="football-player-v2">
  <video id="fpv-video" playsinline webkit-playsinline preload="metadata"></video>

  <div class="fpv-overlay">

    <div class="fpv-center">
      <button type="button" id="fpv-back" class="fpv-skip">
        <svg viewBox="0 0 64 64">
          <path d="M14 23V8M14 23L29 22M14 23A23 23 0 1 1 11 42"/>
          <text x="32" y="41">10</text>
        </svg>
      </button>

      <button type="button" id="fpv-main-play" class="fpv-main-play">
        <svg viewBox="0 0 64 64"><path d="M18 9L54 32L18 55Z"/></svg>
      </button>

      <button type="button" id="fpv-forward" class="fpv-skip">
        <svg viewBox="0 0 64 64">
          <path d="M50 23V8M50 23L35 22M50 23A23 23 0 1 0 53 42"/>
          <text x="32" y="41">10</text>
        </svg>
      </button>
    </div>

    <div class="fpv-bottom">
      <input type="range" id="fpv-seek" min="0" max="1000" value="0">

      <div class="fpv-toolbar">

        <button type="button" id="fpv-play">
          <svg viewBox="0 0 64 64"><path d="M18 9L54 32L18 55Z"/></svg>
        </button>

        <div class="fpv-volume-box">
          <button type="button" id="fpv-mute">
            <svg viewBox="0 0 64 64">
              <path d="M5 24H17L36 9V55L17 40H5Z"/>
              <path d="M44 20Q57 32 44 44M49 10Q69 32 49 54" fill="none"/>
            </svg>
          </button>
          <input type="range" id="fpv-volume" min="0" max="1" step="0.05" value="1">
        </div>

        <div class="fpv-live"><span></span> LIVE</div>

        <div class="fpv-spacer"></div>

        <button type="button" id="fpv-refresh">
          <svg viewBox="0 0 64 64">
            <path d="M52 17V5M52 17H40M52 17A25 25 0 1 0 55 39"/>
          </svg>
        </button>

        <div class="fpv-settings">
          <button type="button" id="fpv-settings-btn">
            <svg viewBox="0 0 64 64">
              <path d="M27 5H37L39 12Q43 13 46 16L53 13L59 22L54 28V36L59 42L53 51L46 48Q43 51 39 52L37 59H27L25 52Q21 51 18 48L11 51L5 42L10 36V28L5 22L11 13L18 16Q21 13 25 12Z"/>
              <circle cx="32" cy="32" r="9" fill="#222"/>
            </svg>
          </button>

          <div id="fpv-menu">
            <strong>SETTINGS</strong>
            <label>Kualitas Video</label>
            <select id="fpv-quality">
              <option value="-1">Auto</option>
            </select>
            <label>Kecepatan</label>
            <select id="fpv-speed">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected>Normal</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </div>
        </div>

        <button type="button" id="fpv-fullscreen">
          <svg viewBox="0 0 64 64">
            <path d="M8 25V8H25M39 8H56V25M56 39V56H39M25 56H8V39"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="fpv-error">
      <span id="fpv-error-text"></span>
      <button type="button" id="fpv-retry">COBA LAGI</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>

<style>
#football-player-v2 {
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
  border-radius:4px;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  isolation:isolate;
  user-select:none;
}

#football-player-v2 * {
  box-sizing:border-box;
}

#fpv-video {
  display:block;
  width:100%;
  height:100%;
  background:#000;
  object-fit:contain;
}

#football-player-v2 button {
  appearance:none;
  border:0;
  outline:0;
  background:transparent;
  padding:0;
  color:#d9f000;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:0;
  line-height:1;

#football-player-v2 button svg {
  display:block;

  height:100%;
  fill:currentColor;
  stroke:currentColor;
  stroke-width:3;

  stroke-linejoin:round;
  overflow:visible;
}

.fpv-overlay {
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.8),transparent 65%);
  transition:opacity .3s;
}

.fpv-overlay button,
.fpv-overlay input,
.fpv-overlay select {
  pointer-events:auto;
}

#football-player-v2.fpv-hidden .fpv-overlay {
  opacity:0;
  pointer-events:none;
}

.fpv-center {
  position:absolute;
  top:50%;
  left:0;
  right:0;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15%;
}

.fpv-center button {
  width:45px;
  height:45px;
}

.fpv-center .fpv-main-play {
  width:62px;
  height:62px;
}

.fpv-skip svg {
  fill:none!important;
  stroke:#d9f000!important;
  filter:drop-shadow(0 2px 4px #000);
}

.fpv-skip svg text {
  fill:#d9f000;
  stroke:none;
  font-size:16px;
  font-weight:bold;
  text-anchor:middle;
}

  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:0 14px 12px;
}

#fpv-seek {

  display:block;
  width:100%;
  height:6px;
  margin:0 0 22px;
  border-radius:10px;

  accent-color:#d9f000;
  cursor:pointer;

#fpv-seek::-webkit-slider-thumb {
  appearance:none;

  height:19px;
  border-radius:50%;

}

#fpv-seek::-moz-range-thumb {
  width:19px;
  height:19px;
  border:0;
  border-radius:50%;
  background:#fff;
}

.fpv-toolbar {
  display:flex;
  align-items:center;
  gap:14px;
  min-height:32px;
}

.fpv-toolbar > button,
.fpv-settings > button {
  width:29px;
  height:29px;
  flex-shrink:0;
}

.fpv-volume-box {
  display:flex;
  align-items:center;
  gap:8px;
}

#fpv-mute {
  width:33px;
  height:33px;
}

#fpv-volume {
  appearance:none;
  width:70px;
  height:6px;
  background:#d9f000;
  border-radius:10px;
  cursor:pointer;
}

#fpv-volume::-webkit-slider-thumb {
  appearance:none;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#d9f000;
}

#fpv-volume::-moz-range-thumb {
  width:17px;
  height:17px;
  border:0;
  border-radius:50%;
  background:#d9f000;
}

.fpv-live {
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
}

.fpv-live span {
  width:12px;
  height:12px;
  border-radius:50%;
  background:#ed2448;
}

.fpv-spacer {
  flex:1;
  min-width:3px;
}

.fpv-settings {
  position:relative;
  flex-shrink:0;
}

#fpv-menu {
  display:none;
  position:absolute;
  bottom:43px;
  right:-30px;
  width:175px;
  padding:13px;
  background:rgba(20,20,20,.98);
  border:1px solid #555;
  border-radius:8px;
  z-index:10;
  color:white;
}

#fpv-menu.show {
  display:block;
}

  display:block;
  color:#d9f000;
  font-size:12px;
  margin-bottom:10px;
}

#fpv-menu label {
  display:block;
  font-size:12px;
  margin:10px 0 5px;
}

#fpv-menu select {
  width:100%;
  padding:8px;
  color:#fff;
  background:#333;
  border:1px solid #555;
  border-radius:4px;
  font-size:12px;
}

#fpv-error {
  display:none;
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:20;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
  padding:20px;
  text-align:center;
  font-size:13px;
  line-height:1.6;
}

#fpv-error button {
  background:#d9f000;
  color:#111;
  font-size:12px;
  padding:10px 18px;
  border-radius:4px;
  font-weight:bold;
}

@media(max-width:500px) {
  .fpv-toolbar {gap:8px}
  .fpv-toolbar > button,
  .fpv-settings > button {width:24px;height:24px}
  #fpv-mute {width:26px;height:26px}
  #fpv-volume {width:42px}
  .fpv-center button {width:37px;height:37px}
  .fpv-center .fpv-main-play {width:50px;height:50px}
  .fpv-live {font-size:11px;gap:5px}
  .fpv-live span {width:10px;height:10px}
  .fpv-bottom {padding:0 9px 9px}
  #fpv-seek {margin-bottom:16px}
}

#football-player-v2:fullscreen {
  width:100%;
  height:100%;
  aspect-ratio:auto;
  border-radius:0;
}

#football-player-v2:fullscreen #fpv-video {
  width:100%;
  height:100%;
}
</style>

<script>
(function(){
  const player=document.getElementById("football-player-v2");
  if(!player || player.dataset.initialized) return;
  player.dataset.initialized="yes";

  const $=id=>document.getElementById(id);
  const video=$("fpv-video");

  // AMBIL URL DARI PARAMETER ?url=
  const params=new URLSearchParams(window.location.search);
  const STREAM_URL=params.get("url") || "";

  let hls=null;
  let hideTimer=null;

  const playSVG='<svg viewBox="0 0 64 64"><path d="M18 9L54 32L18 55Z"/></svg>';
  const pauseSVG='<svg viewBox="0 0 64 64"><path d="M17 10H27V54H17ZM37 10H47V54H37Z"/></svg>';

  function validURL(url){
    try{
      const u=new URL(url);
      return u.protocol==="https:" || u.protocol==="http:";
    }catch(e){
      return false;
    }
  }

  function updateIcons(){
    const icon=video.paused?playSVG:pauseSVG;
    $("fpv-play").innerHTML=icon;
    $("fpv-main-play").innerHTML=icon;
  }

  function showError(message){
    $("fpv-error-text").textContent=message;
    $("fpv-error").style.display="flex";
  }

  function clearError(){
    $("fpv-error").style.display="none";
  }

  function loadStream(){
    clearError();

    if(hls){
      hls.destroy();
      hls=null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    if(!validURL(STREAM_URL)){
      showError("URL streaming tidak ditemukan atau tidak valid. Gunakan format ?url=LINK-STREAMING");
      updateIcons();
      return;
    }

    const isHLS=/\.m3u8(?:$|[?#])/i.test(STREAM_URL);

    if(isHLS && window.Hls && Hls.isSupported()){
      hls=new Hls({
        enableWorker:true,
        lowLatencyMode:true,
        liveSyncDurationCount:3,
        maxBufferLength:30
      });

      hls.loadSource(STREAM_URL);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED,function(){
        updateQuality();
      });

      hls.on(Hls.Events.ERROR,function(event,data){
        if(data.fatal){
          if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
            hls.recoverMediaError();
          }else{
            showError("Streaming gagal dimuat. Periksa URL, token, CORS atau akses server.");
          }
        }
      });

    }else if(isHLS && video.canPlayType("application/vnd.apple.mpegurl")){
      video.src=STREAM_URL;
      video.load();

    }else if(!isHLS){
      video.src=STREAM_URL;
      video.load();

    }else{
      showError("Browser tidak mendukung HLS.");
    }

    updateIcons();
  }

  function togglePlay(){
    if(video.paused){
      clearError();
      video.play().catch(function(){
        showError("Video tidak dapat diputar. Periksa URL dan akses streaming.");
      });
    }else{
      video.pause();
    }
  }

  $("fpv-play").onclick=togglePlay;
  $("fpv-main-play").onclick=togglePlay;
  video.onclick=togglePlay;

  video.onplay=updateIcons;
  video.onpause=updateIcons;

  $("fpv-back").onclick=function(){
    if(video.seekable.length){
      video.currentTime=Math.max(video.seekable.start(0),video.currentTime-10);
    }else if(Number.isFinite(video.duration)){
      video.currentTime=Math.max(0,video.currentTime-10);
    }
  };

  $("fpv-forward").onclick=function(){
    if(video.seekable.length){
      const end=video.seekable.end(video.seekable.length-1);
      video.currentTime=Math.min(end,video.currentTime+10);
    }else if(Number.isFinite(video.duration)){
      video.currentTime=Math.min(video.duration,video.currentTime+10);
    }
  };

  function updateProgress(){
    let start=0;
    let end=video.duration;

    if(video.seekable.length){
      start=video.seekable.start(0);
      end=video.seekable.end(video.seekable.length-1);
    }

    if(Number.isFinite(end)&&end>start){
      const p=Math.max(0,Math.min(100,
        (video.currentTime-start)/(end-start)*100
      ));
      $("fpv-seek").value=p*10;
      $("fpv-seek").style.background=
        "linear-gradient(to right,#d9f000 "+p+"%,#777 "+p+"%)";
    }
  }

  video.ontimeupdate=updateProgress;
  video.onprogress=updateProgress;
  video.onloadedmetadata=updateProgress;

  $("fpv-seek").oninput=function(){
    let start=0;
    let end=video.duration;

    if(video.seekable.length){
      start=video.seekable.start(0);
      end=video.seekable.end(video.seekable.length-1);
    }

    if(Number.isFinite(end)&&end>start){
      video.currentTime=start+(this.value/1000)*(end-start);
    }
  };

  $("fpv-volume").oninput=function(){
    video.volume=Number(this.value);
    video.muted=false;
    updateMute();
  };

  $("fpv-mute").onclick=function(){
    video.muted=!video.muted;
    updateMute();
  };

  function updateMute(){
    $("fpv-mute").innerHTML=video.muted||video.volume===0
      ?'<svg viewBox="0 0 64 64"><path d="M5 24H17L36 9V55L17 40H5Z"/><path d="M44 21L59 43M59 21L44 43" fill="none"/></svg>'
      :'<svg viewBox="0 0 64 64"><path d="M5 24H17L36 9V55L17 40H5Z"/><path d="M44 20Q57 32 44 44M49 10Q69 32 49 54" fill="none"/></svg>';
  }

  $("fpv-refresh").onclick=loadStream;

  $("fpv-fullscreen").onclick=function(){
    if(!document.fullscreenElement){
      player.requestFullscreen?.();
    }else{
      document.exitFullscreen?.();
    }
  };

  $("fpv-settings-btn").onclick=function(e){
    e.stopPropagation();
    $("fpv-menu").classList.toggle("show");
  };

  document.addEventListener("click",function(e){
    if(!e.target.closest("#football-player-v2 .fpv-settings")){
      $("fpv-menu").classList.remove("show");
    }
  });

  $("fpv-speed").onchange=function(){
    video.playbackRate=Number(this.value);
  };

  function updateQuality(){
    if(!hls)return;
    const select=$("fpv-quality");
    select.innerHTML='<option value="-1">Auto</option>';

    hls.levels.forEach(function(level,index){
      const option=document.createElement("option");
      option.value=index;
      option.textContent=level.height?level.height+"p":"Level "+index;
      select.appendChild(option);
    });
  }

  $("fpv-quality").onchange=function(){
    if(hls)hls.currentLevel=Number(this.value);
  };

  function showControls(){
    player.classList.remove("fpv-hidden");
    clearTimeout(hideTimer);

    if(!video.paused){
      hideTimer=setTimeout(function(){
        $("fpv-menu").classList.remove("show");
        player.classList.add("fpv-hidden");
      },3000);
    }
  }

  player.addEventListener("mousemove",showControls);
  player.addEventListener("touchstart",showControls);
  video.addEventListener("play",showControls);
  video.addEventListener("pause",showControls);

  $("fpv-retry").onclick=loadStream;

  loadStream();
})();
    </script>
